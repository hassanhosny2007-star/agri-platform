<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الرئيسية — AgroNex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="site-assets/theme.css">
<script src="site-assets/layout.js"></script>
</head>
<body>

  <div class="page-title-row">
    <div>
      <h1 id="welcome-title">أهلًا بيك 👋</h1>
    </div>
  </div>

  <div class="weather-card" id="weather">
    <div class="w-city">📍 جاري تحديد موقعك...</div>
  </div>

  <div class="stat-tiles" id="quick-tiles">
    <a class="stat-tile tile-green" href="diagnose.html">
      <span class="tile-icon">🌿</span>
      <div>
        <div class="tile-label">تشخيص أمراض النبات</div>
        <div class="tile-sub">صوّر النبات واعرف التشخيص فورًا</div>
      </div>
    </a>
    <a class="stat-tile tile-blue" href="knowledge-base.html">
      <span class="tile-icon">📚</span>
      <div>
        <div class="tile-label">بنك المعرفة</div>
        <div class="tile-sub">مقالات ومعلومات زراعية موثوقة</div>
      </div>
    </a>
    <a class="stat-tile tile-teal" href="mix-checker.html">
      <span class="tile-icon">🧪</span>
      <div>
        <div class="tile-label">خلط المبيدات والأسمدة</div>
        <div class="tile-sub">تأكد قبل ما تخلط أي مادتين</div>
      </div>
    </a>
    <a class="stat-tile tile-indigo" href="substances-directory.html">
      <span class="tile-icon">🔍</span>
      <div>
        <div class="tile-label">دليل المواد الفعالة</div>
        <div class="tile-sub">تصنيف واستخدام كل مادة</div>
      </div>
    </a>
    <a class="stat-tile tile-orange" href="engineer-profile.html">
      <span class="tile-icon">👤</span>
      <div>
        <div class="tile-label">بروفايلي</div>
        <div class="tile-sub">مزارعك ومحاصيلك وبياناتك</div>
      </div>
    </a>
  </div>

<script>
  const SUPABASE_URL = "https://tzpoytzacshvmpzfclfv.supabase.co";
  const SUPABASE_KEY = "sb_publishable_nRVb27QsyVgsiRB-vBFqgw_rNyhkDQs";
  const { createClient } = supabase;
  const customStorage = {
    getItem: (key) => {
      const remember = localStorage.getItem('agronex-remember') !== 'false';
      return remember ? localStorage.getItem(key) : sessionStorage.getItem(key);
    },
    setItem: (key, value) => {
      const remember = localStorage.getItem('agronex-remember') !== 'false';
      if(remember){ localStorage.setItem(key, value); sessionStorage.removeItem(key); }
      else { sessionStorage.setItem(key, value); localStorage.removeItem(key); }
    },
    removeItem: (key) => { localStorage.removeItem(key); sessionStorage.removeItem(key); }
  };
  const db = createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storage: customStorage } });

  const ROLE_LABELS_SINGULAR = { farmer: 'مزارع', engineer: 'مهندس', trader: 'تاجر', company: 'شركة' };

  async function loadAdminTiles(){
    const { data: profiles } = await db.from('profiles').select('role, is_active');
    const total = (profiles || []).length;
    const totalActive = (profiles || []).filter(p => p.is_active !== false).length;

    document.getElementById('quick-tiles').insertAdjacentHTML('beforeend', `
      <a class="stat-tile tile-red" href="admin.html">
        <span class="tile-icon">👥</span>
        <div>
          <div class="tile-label">المستخدمين</div>
          <div class="tile-sub">${totalActive} حساب نشط من إجمالي ${total}</div>
        </div>
      </a>
      <a class="stat-tile tile-purple" href="admin-profile.html">
        <span class="tile-icon">🛠️</span>
        <div>
          <div class="tile-label">بروفايل المدير</div>
          <div class="tile-sub">لوحة تحكم الأدمن الكاملة</div>
        </div>
      </a>
    `);
  }

  (async () => {
    const ctx = await AgroNexLayout.init({ active: 'dashboard', db });
    if(!ctx) return;

    const roleLabel = ctx.isAdmin ? 'المدير' : (ROLE_LABELS_SINGULAR[ctx.profile?.role] || '');
    const name = ctx.profile?.full_name || '';
    document.getElementById('welcome-title').textContent = `أهلًا بيك 👋 ${roleLabel} ${name}`.trim();

    if(ctx.isAdmin){
      await loadAdminTiles();
    }

    // خانة الطقس - بتشتغل هنا بعد ما بناء الصفحة يخلص، عشان تمسك العنصر الصحيح الظاهر فعليًا
    loadWeather();
  })();

  function showWeatherError(text){
    const weatherEl = document.getElementById('weather');
    weatherEl.innerHTML = `<div class="w-error" id="retry-weather">⚠️ ${text} — إعادة المحاولة</div>`;
    document.getElementById('retry-weather').addEventListener('click', loadWeather);
  }
  async function loadWeather(){
    const weatherEl = document.getElementById('weather');
    if(!weatherEl) return;
    weatherEl.innerHTML = '<div class="w-city">📍 جاري تحديد موقعك...</div>';
    if(!navigator.geolocation){ showWeatherError('المتصفح لا يدعم تحديد الموقع'); return; }

    // شبكة أمان: لو مفيش رد خالص خلال 12 ثانية، اعرض رسالة بدل ما تفضل معلقة
    let settled = false;
    const safetyTimer = setTimeout(() => {
      if(!settled){ settled = true; showWeatherError('استغرق الطلب وقت طويل'); }
    }, 12000);

    navigator.geolocation.getCurrentPosition(async (pos) => {
      if(settled) return;
      clearTimeout(safetyTimer);
      settled = true;
      const { latitude, longitude } = pos.coords;
      try{
        document.getElementById('weather').innerHTML = '<div class="w-city">☁️ جاري جلب بيانات الطقس...</div>';
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m`;
        const res = await fetch(url);
        const data = await res.json();
        const temp = Math.round(data.current.temperature_2m);
        const humidity = Math.round(data.current.relative_humidity_2m);
        let cityName = 'موقعك الحالي';
        try{
          const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/reverse?latitude=${latitude}&longitude=${longitude}&language=ar`);
          const geoData = await geoRes.json();
          if(geoData.results && geoData.results.length){ cityName = geoData.results[0].name; }
        }catch(e){}
        document.getElementById('weather').innerHTML = `
          <div class="w-city">📍 ${cityName}</div>
          <div class="w-temp">${temp}°</div>
          <div class="w-humidity">الرطوبة: ${humidity}%</div>`;
      }catch(err){ showWeatherError('تعذر جلب بيانات الطقس'); }
    }, (err) => {
      if(settled) return;
      clearTimeout(safetyTimer);
      settled = true;
      showWeatherError(err.code === err.PERMISSION_DENIED ? 'يرجى السماح بالوصول للموقع' : 'تعذر تحديد الموقع');
    }, {
      timeout: 10000,
      maximumAge: 300000,
      enableHighAccuracy: false
    });
  }
</script>
</body>
</html>

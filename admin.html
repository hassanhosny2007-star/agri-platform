<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="site-assets/logo.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم الأدمن — AgroNex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="site-assets/theme.css">
<script src="site-assets/layout.js"></script>
</head>
<body>

  <div class="page-title-row">
    <div>
      <a href="dashboard.html" style="font-size:13px; color:var(--ink-soft); text-decoration:none;">← رجوع للرئيسية</a>
      <h1>لوحة تحكم الأدمن</h1>
      <div class="sub">نظرة عامة على المنصة والمستخدمين</div>
    </div>
  </div>

  <div class="stat-tiles" id="tiles"><div class="surface-card">جاري التحميل...</div></div>

<script>
  const SUPABASE_URL = "https://tzpoytzacshvmpzfclfv.supabase.co";
  const SUPABASE_KEY = "sb_publishable_nRVb27QsyVgsiRB-vBFqgw_rNyhkDQs";
  const { createClient } = supabase;
  const customStorage = {
    getItem: (key) => {
      const remember = localStorage.getItem('agronex-remember') !== 'false';
      return remember ? localStorage.getItem(key) : sessionStorage.getItem(key);
    },
    setItem: (key, value) => {
      const remember = localStorage.getItem('agronex-remember') !== 'false';
      if(remember){ localStorage.setItem(key, value); sessionStorage.removeItem(key); }
      else { sessionStorage.setItem(key, value); localStorage.removeItem(key); }
    },
    removeItem: (key) => { localStorage.removeItem(key); sessionStorage.removeItem(key); }
  };
  const db = createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storage: customStorage } });

  const CATEGORIES = [
    { role: 'company', label: 'الشركات', icon: '🏢', color: 'tile-indigo' },
    { role: 'engineer', label: 'المهندسين الزراعيين', icon: '👨‍🔬', color: 'tile-blue' },
    { role: 'trader', label: 'التجار', icon: '💼', color: 'tile-orange' },
    { role: 'farmer', label: 'المزارعين', icon: '🌾', color: 'tile-green' },
  ];

  async function loadTiles(){
    const { data: allProfiles } = await db.from('profiles').select('role, is_active');

    const categoryTiles = CATEGORIES.map(c => {
      const usersInRole = (allProfiles || []).filter(p => p.role === c.role);
      const total = usersInRole.length;
      const active = usersInRole.filter(p => p.is_active !== false).length;
      return `
        <a class="stat-tile ${c.color}" href="admin-category.html?role=${c.role}">
          <span class="badge-num">${total}</span>
          <span class="tile-icon">${c.icon}</span>
          <div>
            <div class="tile-label">${c.label}</div>
            <div class="tile-sub">${active} حساب مفعّل</div>
          </div>
        </a>`;
    }).join('');

    const extraTiles = `
      <a class="stat-tile tile-red" href="admin-diagnoses.html">
        <span class="tile-icon">📋</span>
        <div>
          <div class="tile-label">سجل التشخيصات</div>
          <div class="tile-sub">كل عمليات التشخيص</div>
        </div>
      </a>
      <a class="stat-tile tile-pink" href="knowledge-manage.html">
        <span class="tile-icon">🗂️</span>
        <div>
          <div class="tile-label">إدارة بنك المعرفة</div>
          <div class="tile-sub">إضافة وتحديث المقالات</div>
        </div>
      </a>
      <a class="stat-tile tile-teal" href="mix-checker-manage.html">
        <span class="tile-icon">⚗️</span>
        <div>
          <div class="tile-label">إدارة جدول الخلط</div>
          <div class="tile-sub">المواد وقواعد التوافق</div>
        </div>
      </a>
      <a class="stat-tile tile-red" href="disease-risk-manage.html">
        <span class="tile-icon">🔬</span>
        <div>
          <div class="tile-label">إدارة مخاطر الأمراض</div>
          <div class="tile-sub">إضافة محاصيل وأمراض جديدة</div>
        </div>
      </a>`;

    document.getElementById('tiles').innerHTML = categoryTiles + extraTiles;
  }

  (async () => {
    const ctx = await AgroNexLayout.init({ active: 'admin-dashboard', db });
    if(!ctx) return;

    if(!ctx.isAdmin){
      document.getElementById('page-content').innerHTML = '<div class="surface-card">🚫 الصفحة دي للأدمن بس</div>';
      return;
    }

    loadTiles();
  })();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="site-assets/logo.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة الصلاحيات — لوحة الأدمن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg:#F6F1E4; --ink:#1E2A1B; --leaf:#3B5B37; --leaf-deep:#24391F;
    --line:#CDBF9C; --paper:#FCFAF3; --rust:#A85D28;
  }
[data-theme="dark"]{
    --bg: #12181B; --ink: #EDEFEC; --leaf: #6FA568; --leaf-deep: #8FC286;
    --line: #2B3438; --paper: #1B2327; --rust: #D48A52;
}
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--bg); color:var(--ink); font-family:'IBM Plex Sans Arabic', sans-serif; padding:24px; }
  .top{ max-width:680px; margin:0 auto 8px; }
  a.back{ color:var(--leaf-deep); font-size:14px; text-decoration:none; }
  h1{ max-width:680px; margin:8px auto 6px; font-family:'Tajawal'; font-weight:900; font-size:20px; color:var(--leaf-deep); }
  .subtitle{ max-width:680px; margin:0 auto 20px; color:#5b543f; font-size:13px; }

  .list-wrap{ max-width:680px; margin:0 auto; }
  .perm-card{ background:var(--paper); border:1px solid var(--line); border-radius:14px; margin-bottom:10px; overflow:hidden; }
  .perm-header{ padding:16px 18px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
  .perm-header .p-name{ font-family:'Tajawal'; font-weight:700; font-size:14.5px; }
  .perm-header .p-arrow{ font-size:13px; color:#8a7f63; transition:transform .2s; }
  .perm-header.open .p-arrow{ transform:rotate(180deg); }

  .perm-body{ display:none; padding:0 18px 18px; border-top:1px solid var(--bg); }
  .perm-body.open{ display:block; padding-top:16px; }

  .scope-tabs{ display:flex; gap:6px; margin-bottom:12px; }
  .s-tab{ flex:1; text-align:center; padding:9px; border-radius:8px; border:1px solid var(--line); background:var(--bg); cursor:pointer; font-family:'Tajawal'; font-weight:700; font-size:12px; }
  .s-tab.active{ background:var(--leaf); color:#fff; border-color:var(--leaf); }
  .scope-sub{ display:none; margin-bottom:12px; }
  .scope-sub.active{ display:block; }
  select{
    width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--line);
    background:#fff; font-size:13.5px; font-family:inherit;
  }

  .action-row{ display:flex; gap:8px; }
  .action-btn{ flex:1; padding:11px; border:none; border-radius:9px; cursor:pointer; font-family:'Tajawal'; font-weight:700; font-size:13px; }
  .action-btn.enable{ background:#E8F5E9; color:#2E7D32; }
  .action-btn.enable:hover{ background:#2E7D32; color:#fff; }
  .action-btn.disable{ background:#FDECEA; color:#C62828; }
  .action-btn.disable:hover{ background:#C62828; color:#fff; }
  .action-btn:disabled{ opacity:.6; cursor:not-allowed; }

  .result-msg{ font-size:12px; margin-top:10px; text-align:center; min-height:16px; }
  .denied{ max-width:680px; margin:60px auto; text-align:center; color:#5b543f; font-family:'Tajawal'; }
</style>
</head>
<body>
<script>document.documentElement.setAttribute("data-theme", localStorage.getItem("agronex-theme") || "light");</script>
  <div class="top"><a class="back" href="admin.html">← رجوع للوحة التحكم</a></div>
  <h1>🔐 إدارة الصلاحيات</h1>
  <p class="subtitle">دوس على أي صلاحية عشان تختار تفعّلها أو تقفلها — لمستخدم واحد، لفئة كاملة، أو لكل المستخدمين</p>

  <div id="access-gate">
    <div class="list-wrap" id="perm-list"></div>
  </div>

<script>
  const SUPABASE_URL = "https://tzpoytzacshvmpzfclfv.supabase.co";
  const SUPABASE_KEY = "sb_publishable_nRVb27QsyVgsiRB-vBFqgw_rNyhkDQs";
  const { createClient } = supabase;
  const customStorage = {
    getItem: (key) => {
      const remember = localStorage.getItem('agronex-remember') !== 'false';
      return remember ? localStorage.getItem(key) : sessionStorage.getItem(key);
    },
    setItem: (key, value) => {
      const remember = localStorage.getItem('agronex-remember') !== 'false';
      if(remember){ localStorage.setItem(key, value); sessionStorage.removeItem(key); }
      else { sessionStorage.setItem(key, value); localStorage.removeItem(key); }
    },
    removeItem: (key) => { localStorage.removeItem(key); sessionStorage.removeItem(key); }
  };
  const db = createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storage: customStorage } });

  const PERMISSIONS_CONFIG = [
    { key: 'can_add_farms', label: 'إضافة مزارع جديدة' },
    { key: 'can_manage_crops', label: 'إدارة المحاصيل والسجلات' },
    { key: 'can_use_ai_diagnosis', label: 'استخدام تشخيص الذكاء الاصطناعي' },
    { key: 'can_export_reports', label: 'تصدير التقارير' },
    { key: 'can_view_knowledge_base', label: 'الدخول لبنك المعرفة' },
    { key: 'can_use_mix_checker', label: 'استخدام خلط المبيدات والأسمدة' },
    { key: 'can_view_substances', label: 'الدخول لدليل المواد الفعالة' },
    { key: 'can_view_crop_prices', label: 'مشاهدة أسعار المحاصيل' },
    { key: 'can_use_disease_risk', label: 'استخدام تحليل مخاطر الأمراض' },
    { key: 'can_view_weather_history', label: 'الدخول لسجل الطقس' },
  ];
  const ROLE_LABELS = { farmer:'المزارعين', engineer:'المهندسين الزراعيين', trader:'التجار', company:'الشركات' };

  let allUsers = [];

  function buildPermCard(perm){
    return `
      <div class="perm-card">
        <div class="perm-header" data-key="${perm.key}">
          <span class="p-name">${perm.label}</span>
          <span class="p-arrow">▾</span>
        </div>
        <div class="perm-body" id="body-${perm.key}">
          <div class="scope-tabs" data-key="${perm.key}">
            <div class="s-tab active" data-scope="all">الكل</div>
            <div class="s-tab" data-scope="role">فئة معينة</div>
            <div class="s-tab" data-scope="user">مستخدم واحد</div>
          </div>
          <div class="scope-sub" id="sub-role-${perm.key}">
            <select id="role-select-${perm.key}">
              <option value="farmer">المزارعين</option>
              <option value="engineer">المهندسين الزراعيين</option>
              <option value="trader">التجار</option>
              <option value="company">الشركات</option>
            </select>
          </div>
          <div class="scope-sub" id="sub-user-${perm.key}">
            <select id="user-select-${perm.key}">
              <option value="">اختار مستخدم...</option>
              ${allUsers.map(u => `<option value="${u.id}">${u.full_name || u.email} (${ROLE_LABELS[u.role] || u.role})</option>`).join('')}
            </select>
          </div>
          <div class="action-row">
            <button class="action-btn enable" data-key="${perm.key}" data-value="true">✅ تفعيل</button>
            <button class="action-btn disable" data-key="${perm.key}" data-value="false">⛔ تعطيل</button>
          </div>
          <div class="result-msg" id="msg-${perm.key}"></div>
        </div>
      </div>`;
  }

  function getScope(key){
    return document.querySelector(`.scope-tabs[data-key="${key}"] .s-tab.active`).getAttribute('data-scope');
  }

  async function applyPermission(key, value){
    const scope = getScope(key);
    const msg = document.getElementById(`msg-${key}`);
    const label = PERMISSIONS_CONFIG.find(p => p.key === key).label;

    let confirmText, targetUserIds = [];

    if(scope === 'all'){
      confirmText = `متأكد إنك عايز ${value ? 'تفعّل' : 'تقفل'} "${label}" لكل المستخدمين؟`;
    } else if(scope === 'role'){
      const role = document.getElementById(`role-select-${key}`).value;
      confirmText = `متأكد إنك عايز ${value ? 'تفعّل' : 'تقفل'} "${label}" لفئة "${ROLE_LABELS[role]}" كاملة؟`;
    } else {
      const userId = document.getElementById(`user-select-${key}`).value;
      if(!userId){ msg.style.color = 'var(--rust)'; msg.textContent = 'اختار مستخدم الأول'; return; }
      const u = allUsers.find(u => u.id === userId);
      confirmText = `متأكد إنك عايز ${value ? 'تفعّل' : 'تقفل'} "${label}" لـ ${u.full_name || u.email}؟`;
    }

    if(!confirm(confirmText)) return;

    document.querySelectorAll(`.action-btn[data-key="${key}"]`).forEach(b => b.disabled = true);
    msg.style.color = '#5b543f';
    msg.textContent = 'جاري التطبيق...';

    if(scope === 'user'){
      const userId = document.getElementById(`user-select-${key}`).value;
      const { data: profile } = await db.from('profiles').select('permissions').eq('id', userId).single();
      const newPermissions = { ...(profile?.permissions || {}), [key]: value };
      const { error } = await db.from('profiles').update({ permissions: newPermissions }).eq('id', userId);

      document.querySelectorAll(`.action-btn[data-key="${key}"]`).forEach(b => b.disabled = false);
      if(error){ msg.style.color = 'var(--rust)'; msg.textContent = 'حصل خطأ: ' + error.message; return; }
      msg.style.color = 'var(--leaf)';
      msg.textContent = '✅ تم التعديل للمستخدم المختار';
    } else {
      const role = scope === 'role' ? document.getElementById(`role-select-${key}`).value : null;
      const { data, error } = await db.rpc('bulk_set_permission', {
        target_scope: scope, target_role: role, perm_key: key, perm_value: value,
      });

      document.querySelectorAll(`.action-btn[data-key="${key}"]`).forEach(b => b.disabled = false);
      if(error){ msg.style.color = 'var(--rust)'; msg.textContent = 'حصل خطأ: ' + error.message; return; }
      msg.style.color = 'var(--leaf)';
      msg.textContent = `✅ تم التعديل على ${data} حساب`;
    }
  }

  function attachCardEvents(){
    document.querySelectorAll('.perm-header').forEach(header => {
      header.addEventListener('click', () => {
        const key = header.getAttribute('data-key');
        const body = document.getElementById(`body-${key}`);
        const isOpen = body.classList.contains('open');
        document.querySelectorAll('.perm-body.open').forEach(b => b.classList.remove('open'));
        document.querySelectorAll('.perm-header.open').forEach(h => h.classList.remove('open'));
        if(!isOpen){
          body.classList.add('open');
          header.classList.add('open');
        }
      });
    });

    document.querySelectorAll('.s-tab').forEach(tab => {
      tab.addEventListener('click', (e) => {
        e.stopPropagation();
        const key = tab.closest('.scope-tabs').getAttribute('data-key');
        tab.closest('.scope-tabs').querySelectorAll('.s-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const scope = tab.getAttribute('data-scope');
        document.querySelectorAll(`.scope-sub[id^="sub-"][id$="-${key}"]`).forEach(s => s.classList.remove('active'));
        if(scope === 'role') document.getElementById(`sub-role-${key}`).classList.add('active');
        if(scope === 'user') document.getElementById(`sub-user-${key}`).classList.add('active');
      });
    });

    document.querySelectorAll('.action-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        applyPermission(btn.getAttribute('data-key'), btn.getAttribute('data-value') === 'true');
      });
    });
  }

  (async () => {
    const { data: { session } } = await db.auth.getSession();
    if(!session){ window.location.href = 'login.html'; return; }
    const { data: myProfile } = await db.from('profiles').select('role').eq('id', session.user.id).single();
    if(!myProfile || myProfile.role !== 'admin'){
      document.getElementById('access-gate').innerHTML = '<div class="denied">🚫 الصفحة دي للأدمن بس</div>';
      return;
    }

    const { data: users } = await db.from('profiles').select('id, full_name, email, role').neq('role', 'admin').order('full_name');
    allUsers = users || [];

    document.getElementById('perm-list').innerHTML = PERMISSIONS_CONFIG.map(buildPermCard).join('');
    attachCardEvents();
  })();
</script>
</body>
</html>

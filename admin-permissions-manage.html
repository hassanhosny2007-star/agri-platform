<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="site-assets/logo.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة الصلاحيات — لوحة الأدمن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="site-assets/permissions-registry.js"></script>
<style>
  :root{
    --bg:#F6F1E4; --ink:#1E2A1B; --leaf:#3B5B37; --leaf-deep:#24391F;
    --line:#CDBF9C; --paper:#FCFAF3; --rust:#A85D28;
    --on-color:#2E7D32; --off-color:#8a8a8a;
  }
[data-theme="dark"]{
    --bg: #12181B; --ink: #EDEFEC; --leaf: #6FA568; --leaf-deep: #8FC286;
    --line: #2B3438; --paper: #1B2327; --rust: #D48A52;
    --on-color:#66BB6A; --off-color:#8a9199;
}
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--bg); color:var(--ink); font-family:'IBM Plex Sans Arabic', sans-serif; padding:24px; }
  .top{ max-width:700px; margin:0 auto 8px; }
  a.back{ color:var(--leaf-deep); font-size:14px; text-decoration:none; }
  h1{ max-width:700px; margin:8px auto 6px; font-family:'Tajawal'; font-weight:900; font-size:20px; color:var(--leaf-deep); }
  .subtitle{ max-width:700px; margin:0 auto 20px; color:#5b543f; font-size:13px; }

  .list-wrap{ max-width:700px; margin:0 auto; }
  .perm-card{ background:var(--paper); border:1px solid var(--line); border-radius:14px; margin-bottom:10px; overflow:hidden; }
  .perm-header{ padding:16px 18px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
  .perm-header .p-name{ font-family:'Tajawal'; font-weight:700; font-size:14.5px; }
  .perm-header .p-arrow{ font-size:13px; color:#8a7f63; transition:transform .2s; }
  .perm-header.open .p-arrow{ transform:rotate(180deg); }

  .perm-body{ display:none; padding:0 18px 18px; border-top:1px solid var(--bg); }
  .perm-body.open{ display:block; padding-top:16px; }

  .view-tabs{ display:flex; gap:6px; margin-bottom:12px; }
  .v-tab{ flex:1; text-align:center; padding:9px 6px; border-radius:8px; border:1px solid var(--line); background:var(--bg); cursor:pointer; font-family:'Tajawal'; font-weight:700; font-size:12px; }
  .v-tab.active{ background:var(--leaf); color:#fff; border-color:var(--leaf); }

  .view-sub{ margin-bottom:12px; }
  select, input[type=text]{
    width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--line);
    background:#fff; font-size:13.5px; font-family:inherit;
  }

  .users-list{ max-height:340px; overflow-y:auto; }
  .bulk-row{
    display:flex; justify-content:space-between; align-items:center; padding:10px 8px;
    background:var(--bg); border-radius:9px; margin-bottom:8px; font-size:12.5px; font-weight:700;
  }
  .bulk-row.master{ background:rgba(168,93,40,.1); margin-bottom:12px; }
  .cat-group-header{
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 4px 6px; border-bottom:1px solid var(--bg); margin-top:10px;
  }
  .cat-group-header:first-child{ margin-top:0; }
  .cat-group-title{ font-family:'Tajawal'; font-weight:800; font-size:12.5px; color:var(--leaf-deep); }
  .user-row{ display:flex; justify-content:space-between; align-items:center; padding:9px 4px; border-bottom:1px solid var(--bg); font-size:13px; }
  .user-row:last-child{ border-bottom:none; }
  .u-switch{
    position:relative; width:46px; height:26px; border-radius:20px; border:none; cursor:pointer;
    background:#cfc7ab; flex-shrink:0; transition:background .2s;
  }
  .u-switch.on{ background:var(--on-color); }
  .u-switch .dot{
    position:absolute; top:2px; right:2px; width:22px; height:22px; background:#fff; border-radius:50%;
    transition:right .2s; box-shadow:0 1px 3px rgba(0,0,0,.25);
  }
  .u-switch.on .dot{ right:22px; }
  .u-switch:disabled{ opacity:.6; cursor:not-allowed; }

  .empty{ text-align:center; color:#5b543f; padding:20px 0; font-size:13px; }
  .denied{ max-width:700px; margin:60px auto; text-align:center; color:#5b543f; font-family:'Tajawal'; }
</style>
</head>
<body>
<script>document.documentElement.setAttribute("data-theme", localStorage.getItem("agronex-theme") || "light");</script>
  <div class="top"><a class="back" href="admin.html">← رجوع للوحة التحكم</a></div>
  <h1>🔐 إدارة الصلاحيات</h1>
  <p class="subtitle">دوس على أي صلاحية عشان تشوف كل المستخدمين وحالتهم — 🟢 شغال / ⚪ مقفول — ودوس على أي زرار تبدّل حالته فورًا</p>

  <div id="access-gate">
    <div class="list-wrap" id="perm-list"></div>
  </div>

<script>
  const SUPABASE_URL = "https://tzpoytzacshvmpzfclfv.supabase.co";
  const SUPABASE_KEY = "sb_publishable_nRVb27QsyVgsiRB-vBFqgw_rNyhkDQs";
  const { createClient } = supabase;
  const customStorage = {
    getItem: (key) => {
      const remember = localStorage.getItem('agronex-remember') !== 'false';
      return remember ? localStorage.getItem(key) : sessionStorage.getItem(key);
    },
    setItem: (key, value) => {
      const remember = localStorage.getItem('agronex-remember') !== 'false';
      if(remember){ localStorage.setItem(key, value); sessionStorage.removeItem(key); }
      else { sessionStorage.setItem(key, value); localStorage.removeItem(key); }
    },
    removeItem: (key) => { localStorage.removeItem(key); sessionStorage.removeItem(key); }
  };
  const db = createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storage: customStorage } });

  const PERMISSIONS_CONFIG = AGRONEX_PERMISSIONS_REGISTRY;
  const ROLE_LABELS = { farmer:'المزارعين', engineer:'المهندسين الزراعيين', trader:'التجار', company:'الشركات' };
  const ROLES_ORDER = ['farmer', 'engineer', 'trader', 'company'];

  let allUsers = [];

  // بيحسب الحالة الفعلية للصلاحية عند مستخدم معيّن (بياخد في الاعتبار الإعدادات الافتراضية حسب نوع الحساب)
  function getEffectiveStatus(user, key){
    const perms = user.permissions || {};
    if(perms[key] !== undefined) return perms[key] === true;
    if(key.startsWith('can_sell_')){
      return ['trader', 'company'].includes(user.role); // افتراضي: التجار والشركات بس يقدروا يبيعوا
    }
    return true; // باقي الصلاحيات مفتوحة افتراضيًا لحد ما الأدمن يقفلها صراحة
  }

  function buildPermCard(perm){
    return `
      <div class="perm-card">
        <div class="perm-header" data-key="${perm.key}">
          <span class="p-name">${perm.label}</span>
          <span class="p-arrow">▾</span>
        </div>
        <div class="perm-body" id="body-${perm.key}">
          <div class="view-tabs" data-key="${perm.key}">
            <div class="v-tab active" data-view="all">كل المستخدمين</div>
            <div class="v-tab" data-view="category">فئة معينة</div>
            <div class="v-tab" data-view="search">مستخدم / عدة مستخدمين</div>
          </div>
          <div class="view-sub" id="sub-category-${perm.key}" style="display:none;">
            <select class="category-select" data-key="${perm.key}">
              <option value="farmer">المزارعين</option>
              <option value="engineer">المهندسين الزراعيين</option>
              <option value="trader">التجار</option>
              <option value="company">الشركات</option>
            </select>
          </div>
          <div class="view-sub" id="sub-search-${perm.key}" style="display:none;">
            <input type="text" class="user-search" data-key="${perm.key}" placeholder="🔍 دوّر بالاسم...">
          </div>
          <div class="users-list" id="users-list-${perm.key}"></div>
        </div>
      </div>`;
  }

  async function toggleUserPermission(userId, key, newValue, btn){
    btn.disabled = true;
    const { data: profile } = await db.from('profiles').select('permissions').eq('id', userId).single();
    const newPermissions = { ...(profile?.permissions || {}), [key]: newValue };
    const { error } = await db.from('profiles').update({ permissions: newPermissions }).eq('id', userId);
    btn.disabled = false;

    if(error){ alert('حصل خطأ: ' + error.message); return; }

    // حدّث النسخة المحلية عشان لو المستخدم بدّل التبويب النتيجة تفضل صحيحة
    const u = allUsers.find(u => u.id === userId);
    if(u){ u.permissions = { ...(u.permissions || {}), [key]: newValue }; }

    btn.classList.toggle('on', newValue);
  }

  function buildUserRow(user, key){
    const isOn = getEffectiveStatus(user, key);
    return `
      <div class="user-row">
        <span>${user.full_name || user.email}</span>
        <button class="u-switch ${isOn ? 'on' : ''}" data-user="${user.id}" data-key="${key}"><span class="dot"></span></button>
      </div>`;
  }

  function attachToggleEvents(container){
    container.querySelectorAll('.u-switch:not(.bulk-switch)').forEach(btn => {
      btn.addEventListener('click', () => {
        const userId = btn.getAttribute('data-user');
        const key = btn.getAttribute('data-key');
        const currentlyOn = btn.classList.contains('on');
        toggleUserPermission(userId, key, !currentlyOn, btn);
      });
    });
  }

  // بيحدد هل كل المستخدمين في مجموعة معيّنة شغالة عندهم الصلاحية دي (يستخدم في عرض حالة مفاتيح التطبيق الجماعي)
  function getGroupStatus(users, key){
    if(!users.length) return false;
    return users.every(u => getEffectiveStatus(u, key));
  }

  function renderUsersList(key, view){
    const listEl = document.getElementById(`users-list-${key}`);

    if(view === 'all'){
      const allOn = getGroupStatus(allUsers, key);
      let html = `
        <div class="bulk-row master">
          <span>🌍 تطبيق على كل المستخدمين</span>
          <button class="u-switch bulk-switch ${allOn ? 'on' : ''}" data-scope="all" data-key="${key}"><span class="dot"></span></button>
        </div>`;
      ROLES_ORDER.forEach(role => {
        const usersInRole = allUsers.filter(u => u.role === role);
        if(!usersInRole.length) return;
        const roleOn = getGroupStatus(usersInRole, key);
        html += `
          <div class="cat-group-header">
            <span class="cat-group-title">${ROLE_LABELS[role]} (${usersInRole.length})</span>
            <button class="u-switch bulk-switch ${roleOn ? 'on' : ''}" data-scope="role" data-role="${role}" data-key="${key}"><span class="dot"></span></button>
          </div>`;
        html += usersInRole.map(u => buildUserRow(u, key)).join('');
      });
      listEl.innerHTML = html;

    } else if(view === 'category'){
      const role = document.querySelector(`.category-select[data-key="${key}"]`).value;
      const usersInRole = allUsers.filter(u => u.role === role);
      const roleOn = getGroupStatus(usersInRole, key);
      let html = `
        <div class="bulk-row">
          <span>تطبيق على فئة "${ROLE_LABELS[role]}" كاملة</span>
          <button class="u-switch bulk-switch ${roleOn ? 'on' : ''}" data-scope="role" data-role="${role}" data-key="${key}"><span class="dot"></span></button>
        </div>`;
      html += usersInRole.length
        ? usersInRole.map(u => buildUserRow(u, key)).join('')
        : '<div class="empty">مفيش مستخدمين في الفئة دي</div>';
      listEl.innerHTML = html;

    } else if(view === 'search'){
      const term = document.querySelector(`.user-search[data-key="${key}"]`).value.trim().toLowerCase();
      const matched = term ? allUsers.filter(u => (u.full_name || u.email || '').toLowerCase().includes(term)) : allUsers;
      listEl.innerHTML = matched.length
        ? matched.map(u => buildUserRow(u, key)).join('')
        : '<div class="empty">مفيش نتائج مطابقة</div>';
    }

    attachToggleEvents(listEl);
    attachBulkEvents(listEl, key, view);
  }

  async function applyBulkPermission(scope, role, key, newValue, btn){
    const label = PERMISSIONS_CONFIG.find(p => p.key === key)?.label || key;
    const confirmText = scope === 'all'
      ? `متأكد إنك عايز ${newValue ? 'تفتح' : 'تقفل'} "${label}" لكل المستخدمين دفعة واحدة؟`
      : `متأكد إنك عايز ${newValue ? 'تفتح' : 'تقفل'} "${label}" لفئة "${ROLE_LABELS[role]}" كاملة دفعة واحدة؟`;
    if(!confirm(confirmText)) return false;

    btn.disabled = true;
    const { data, error } = await db.rpc('bulk_set_permission', {
      target_scope: scope, target_role: scope === 'role' ? role : null, perm_key: key, perm_value: newValue,
    });
    btn.disabled = false;

    if(error){ alert('حصل خطأ: ' + error.message); return false; }

    // حدّث النسخة المحلية لكل المستخدمين المتأثرين عشان الحالة تتحدث فورًا
    allUsers.forEach(u => {
      if(scope === 'all' || u.role === role){
        u.permissions = { ...(u.permissions || {}), [key]: newValue };
      }
    });

    alert(`✅ تم التعديل على ${data} حساب`);
    return true;
  }

  function attachBulkEvents(container, key, view){
    container.querySelectorAll('.bulk-switch').forEach(btn => {
      btn.addEventListener('click', async () => {
        const scope = btn.getAttribute('data-scope');
        const role = btn.getAttribute('data-role');
        const currentlyOn = btn.classList.contains('on');
        const success = await applyBulkPermission(scope, role, key, !currentlyOn, btn);
        if(success) renderUsersList(key, view); // إعادة رسم القائمة عشان كل المفاتيح الفردية تتحدث
      });
    });
  }

  function attachCardEvents(){
    document.querySelectorAll('.perm-header').forEach(header => {
      header.addEventListener('click', () => {
        const key = header.getAttribute('data-key');
        const body = document.getElementById(`body-${key}`);
        const isOpen = body.classList.contains('open');
        document.querySelectorAll('.perm-body.open').forEach(b => b.classList.remove('open'));
        document.querySelectorAll('.perm-header.open').forEach(h => h.classList.remove('open'));
        if(!isOpen){
          body.classList.add('open');
          header.classList.add('open');
          renderUsersList(key, 'all'); // أول ما يتفتح، يعرض كل المستخدمين افتراضيًا
        }
      });
    });

    document.querySelectorAll('.v-tab').forEach(tab => {
      tab.addEventListener('click', (e) => {
        e.stopPropagation();
        const key = tab.closest('.view-tabs').getAttribute('data-key');
        tab.closest('.view-tabs').querySelectorAll('.v-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const view = tab.getAttribute('data-view');

        document.getElementById(`sub-category-${key}`).style.display = view === 'category' ? 'block' : 'none';
        document.getElementById(`sub-search-${key}`).style.display = view === 'search' ? 'block' : 'none';

        renderUsersList(key, view);
      });
    });

    document.querySelectorAll('.category-select').forEach(sel => {
      sel.addEventListener('click', e => e.stopPropagation());
      sel.addEventListener('change', () => renderUsersList(sel.getAttribute('data-key'), 'category'));
    });

    document.querySelectorAll('.user-search').forEach(input => {
      input.addEventListener('click', e => e.stopPropagation());
      input.addEventListener('input', () => renderUsersList(input.getAttribute('data-key'), 'search'));
    });
  }

  (async () => {
    const { data: { session } } = await db.auth.getSession();
    if(!session){ window.location.href = 'login.html'; return; }
    const { data: myProfile } = await db.from('profiles').select('role').eq('id', session.user.id).single();
    if(!myProfile || myProfile.role !== 'admin'){
      document.getElementById('access-gate').innerHTML = '<div class="denied">🚫 الصفحة دي للأدمن بس</div>';
      return;
    }

    const { data: users } = await db.from('profiles').select('id, full_name, email, role, permissions').neq('role', 'admin').order('full_name');
    allUsers = users || [];

    document.getElementById('perm-list').innerHTML = PERMISSIONS_CONFIG.map(buildPermCard).join('');
    attachCardEvents();
  })();
</script>
</body>
</html>

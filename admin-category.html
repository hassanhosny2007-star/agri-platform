<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="site-assets/logo.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مستخدمي الفئة — لوحة الأدمن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg: #F6F1E4; --ink: #1E2A1B; --leaf: #3B5B37; --leaf-deep: #24391F;
    --line: #CDBF9C; --paper: #FCFAF3; --rust: #A85D28;
  }
[data-theme="dark"]{
    --bg: #12181B;
    --ink: #EDEFEC;
    --leaf: #6FA568;
    --leaf-deep: #8FC286;
    --line: #2B3438;
    --paper: #1B2327;
    --rust: #D48A52;
}

  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'IBM Plex Sans Arabic', sans-serif;
    min-height:100vh; padding:24px;
  }
  .top{ max-width:760px; margin:0 auto 8px; }
  a.back{ color:var(--leaf-deep); font-size:14px; text-decoration:none; }
  a.back:hover{ text-decoration:underline; }
  h1{ max-width:760px; margin:8px auto 20px; font-family:'Tajawal'; font-weight:900; font-size:20px; color:var(--leaf-deep); }
  .list{ max-width:760px; margin:0 auto; display:flex; flex-direction:column; gap:10px; }
  .user-row{
    background:var(--paper); border:1px solid var(--line); border-radius:14px;
    padding:14px 16px; display:flex; align-items:center; gap:12px;
  }
  .avatar-wrap{ position:relative; flex-shrink:0; }
  .avatar{ width:48px; height:48px; border-radius:50%; object-fit:cover; background:#e7e0cb; display:block; }
  .online-dot{
    position:absolute; bottom:0; left:0; width:13px; height:13px; border-radius:50%;
    background:#2E7D32; border:2.5px solid var(--paper); display:none;
  }
  .online-dot.show{ display:block; }
  .info{ flex:1; min-width:0; }
  .info a{ text-decoration:none; color:inherit; }
  .name{ font-family:'Tajawal'; font-weight:700; font-size:15px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .badge{ font-size:11px; background:#fbe2e2; color:#a83232; padding:2px 8px; border-radius:20px; }
  .presence-text{ font-size:11px; font-weight:700; padding:2px 8px; border-radius:20px; }
  .presence-text.online{ background:#e8f5e9; color:#2E7D32; }
  .presence-text.offline{ background:#f0eee7; color:#8a7f63; }
  .email{ font-size:13px; color:#5b543f; margin-top:2px; }
  .meta{ font-size:12px; color:#8a7f63; margin-top:2px; }
  .actions{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .farms-count{ font-size:12px; color:#8a7f63; }
  button.toggle, a.detail-btn{
    font-size:12.5px; padding:7px 12px; border-radius:8px; cursor:pointer;
    font-family:'IBM Plex Sans Arabic'; border:1px solid var(--line); background:var(--paper);
    text-decoration:none; color:var(--ink); white-space:nowrap;
  }
  button.toggle.deactivate{ background:#fbe9e9; border-color:#e3b8b8; color:#a83232; }
  button.toggle.activate{ background:#e8f0e5; border-color:#b7cdae; color:var(--leaf-deep); }
  .empty, .loading, .denied{ max-width:760px; margin:60px auto; text-align:center; color:#5b543f; font-family:'Tajawal'; }
</style>
</head>
<body>
<script>document.documentElement.setAttribute("data-theme", localStorage.getItem("agronex-theme") || "light");</script>

  <div class="top"><a class="back" href="admin.html">← رجوع لكل الفئات</a></div>
  <h1 id="page-title">جاري التحميل...</h1>
  <div id="content"><div class="loading">جاري التحميل...</div></div>

<script>
  const SUPABASE_URL = "https://tzpoytzacshvmpzfclfv.supabase.co";
  const SUPABASE_KEY = "sb_publishable_nRVb27QsyVgsiRB-vBFqgw_rNyhkDQs";
  const { createClient } = supabase;
  const customStorage = {
    getItem: (key) => {
      const remember = localStorage.getItem('agronex-remember') !== 'false';
      return remember ? localStorage.getItem(key) : sessionStorage.getItem(key);
    },
    setItem: (key, value) => {
      const remember = localStorage.getItem('agronex-remember') !== 'false';
      if(remember){ localStorage.setItem(key, value); sessionStorage.removeItem(key); }
      else { sessionStorage.setItem(key, value); localStorage.removeItem(key); }
    },
    removeItem: (key) => { localStorage.removeItem(key); sessionStorage.removeItem(key); }
  };
  const db = createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storage: customStorage } });

  const ROLE_LABELS = {
    farmer: 'المزارعين', engineer: 'المهندسين الزراعيين',
    trader: 'التجار', company: 'الشركات',
  };

  const params = new URLSearchParams(window.location.search);
  const role = params.get('role');

  function presenceInfo(lastActiveAt){
    if(!lastActiveAt) return { isOnline: false, text: 'لسه ما دخلش المنصة' };

    const diffMs = Date.now() - new Date(lastActiveAt).getTime();
    const diffMin = Math.floor(diffMs / 60000);

    if(diffMin < 2) return { isOnline: true, text: 'نشط الآن' };

    if(diffMin < 60) return { isOnline: false, text: `نشط منذ ${diffMin} دقيقة` };
    const diffH = Math.floor(diffMin / 60);
    if(diffH < 24) return { isOnline: false, text: `نشط منذ ${diffH} ساعة` };
    const diffD = Math.floor(diffH / 24);
    return { isOnline: false, text: `نشط منذ ${diffD} يوم` };
  }

  function renderUsers(users, currentAdminId){
    if(!users.length){
      document.getElementById('content').innerHTML = '<div class="empty">مفيش مستخدمين في الفئة دي لسه</div>';
      return;
    }
    const rows = users.map(u => {
      const farmsCount = (u.farms && u.farms[0] && u.farms[0].count) || 0;
      const isActive = u.is_active !== false;
      const presence = presenceInfo(u.last_active_at);
      return `
        <div class="user-row" data-id="${u.id}">
          <a href="admin-user.html?id=${u.id}" style="display:flex; align-items:center; gap:12px; flex:1; min-width:0;">
            <div class="avatar-wrap">
              <img class="avatar" src="${u.avatar_url || ''}" onerror="this.style.visibility='hidden'">
              <span class="online-dot ${presence.isOnline ? 'show' : ''}"></span>
            </div>
            <div class="info">
              <div class="name">
                ${u.full_name || '—'}
                ${!isActive ? '<span class="badge">معطّل</span>' : ''}
                <span class="presence-text ${presence.isOnline ? 'online' : 'offline'}">${presence.text}</span>
              </div>
              <div class="email">${u.email}</div>
              ${u.specialization ? `<div class="meta">${u.specialization}</div>` : ''}
            </div>
          </a>
          <div class="actions">
            <span class="farms-count">${farmsCount} مزرعة</span>
            ${u.id !== currentAdminId ? `
              <button class="toggle ${isActive ? 'deactivate' : 'activate'}" data-toggle-id="${u.id}" data-current="${isActive}">
                ${isActive ? 'تعطيل' : 'تفعيل'}
              </button>` : ''}
            <a class="detail-btn" href="admin-user.html?id=${u.id}">الصلاحيات</a>
          </div>
        </div>`;
    }).join('');
    document.getElementById('content').innerHTML = `<div class="list">${rows}</div>`;

    document.querySelectorAll('[data-toggle-id]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.getAttribute('data-toggle-id');
        const current = btn.getAttribute('data-current') === 'true';
        btn.disabled = true;
        btn.textContent = '...';
        const { error } = await db.from('profiles').update({ is_active: !current }).eq('id', id);
        if(!error){
          const row = document.querySelector(`.user-row[data-id="${id}"]`);
          const badge = row.querySelector('.badge');
          if(current){
            if(!badge) row.querySelector('.name').insertAdjacentHTML('afterbegin', '<span class="badge">معطّل</span>');
          } else {
            if(badge) badge.remove();
          }
          btn.setAttribute('data-current', !current);
          btn.className = 'toggle ' + (!current ? 'deactivate' : 'activate');
          btn.textContent = !current ? 'تعطيل' : 'تفعيل';
        } else {
          alert('حصل خطأ، حاول تاني');
        }
        btn.disabled = false;
      });
    });
  }

  let allUsers = [];
  let currentAdminId = null;

  async function loadAndRender(){
    const { data: users, error } = await db
      .from('profiles')
      .select('*, farms(count)')
      .eq('role', role)
      .order('created_at', { ascending: false });

    if(error){
      document.getElementById('content').innerHTML = '<div class="denied">حصل خطأ: ' + error.message + '</div>';
      return;
    }

    allUsers = users || [];
    renderUsers(allUsers, currentAdminId);
  }

  (async () => {
    if(!role || !ROLE_LABELS[role]){ window.location.href = 'admin.html'; return; }

    const { data: { session } } = await db.auth.getSession();
    if(!session){ window.location.href = 'login.html'; return; }

    const { data: myProfile } = await db.from('profiles').select('role').eq('id', session.user.id).single();
    if(!myProfile || myProfile.role !== 'admin'){
      document.getElementById('content').innerHTML = '<div class="denied">🚫 الصفحة دي للأدمن بس</div>';
      document.getElementById('page-title').textContent = '';
      return;
    }

    currentAdminId = session.user.id;
    document.getElementById('page-title').textContent = ROLE_LABELS[role];

    await loadAndRender();

    setInterval(loadAndRender, 30000);
  })();
</script>
</body>
</html>

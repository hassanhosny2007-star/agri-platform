<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إعادة تعيين كلمة المرور — AgroNex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg: #F6F1E4; --ink: #1E2A1B; --leaf: #3B5B37; --leaf-deep: #24391F;
    --rust: #A85D28; --line: #CDBF9C; --paper: #FCFAF3; --error:#B23A2E;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'IBM Plex Sans Arabic', sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .card{
    max-width:420px; width:100%;
    background:var(--paper); border:1px solid var(--line); border-radius:18px;
    padding:36px 32px;
  }
  h1{ font-family:'Tajawal', sans-serif; font-weight:900; font-size:22px; color:var(--leaf-deep); text-align:center; }
  p.hint{ margin-top:10px; text-align:center; color:#5b543f; font-size:14px; }
  form{ margin-top:24px; display:flex; flex-direction:column; gap:14px; }
  label{ font-size:13.5px; font-weight:600; color:var(--leaf-deep); }
  .pw-wrap{ position:relative; }
  input{
    margin-top:6px; width:100%; padding:12px 14px; padding-left:42px; border-radius:9px;
    border:1px solid var(--line); background:#fff; font-size:15px; font-family:inherit;
  }
  input:focus{ outline:2px solid var(--leaf); }
  .pw-toggle{
    position:absolute; left:12px; top:50%; transform:translateY(-50%);
    cursor:pointer; font-size:15px; user-select:none; margin-top:3px;
  }
  button.submit{
    margin-top:6px; padding:13px; border:none; border-radius:9px;
    background:var(--leaf); color:var(--paper); font-family:'Tajawal'; font-weight:700;
    font-size:15.5px; cursor:pointer;
  }
  .msg{ margin-top:16px; font-size:14px; text-align:center; display:none; padding:10px; border-radius:8px; }
  .msg.error{ display:block; background:rgba(178,58,46,0.1); color:var(--error); }
  .msg.success{ display:block; background:rgba(59,91,55,0.1); color:var(--leaf-deep); }
</style>
</head>
<body>
  <div class="card">
    <h1>🌱 AgroNex</h1>
    <p class="hint">اكتب كلمة المرور الجديدة لحسابك</p>
    <form id="form-reset">
      <div>
        <label>كلمة المرور الجديدة (٦ حروف على الأقل)</label>
        <div class="pw-wrap">
          <input type="password" id="new-password" required minlength="6">
          <span class="pw-toggle" data-target="new-password">👁️</span>
        </div>
      </div>
      <button class="submit" type="submit">تحديث كلمة المرور</button>
    </form>
    <div class="msg" id="msg"></div>
  </div>

<script>
  const SUPABASE_URL = "https://tzpoytzacshvmpzfclfv.supabase.co";
  const SUPABASE_KEY = "sb_publishable_nRVb27QsyVgsiRB-vBFqgw_rNyhkDQs";
  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_KEY);

  const msg = document.getElementById('msg');
  function hideMsg(){ msg.className = 'msg'; msg.textContent=''; }
  function showMsg(text, type){ msg.textContent = text; msg.className = 'msg ' + type; }

  document.querySelector('.pw-toggle').addEventListener('click', (e) => {
    const input = document.getElementById(e.target.dataset.target);
    const isHidden = input.type === 'password';
    input.type = isHidden ? 'text' : 'password';
    e.target.textContent = isHidden ? '🙈' : '👁️';
  });

  document.getElementById('form-reset').addEventListener('submit', async (e)=>{
    e.preventDefault();
    hideMsg();
    const password = document.getElementById('new-password').value;
    const { error } = await db.auth.updateUser({ password });
    if(error){ showMsg('خطأ: ' + error.message, 'error'); return; }
    showMsg('تم تحديث كلمة المرور بنجاح! جاري تحويلك لتسجيل الدخول...', 'success');
    setTimeout(() => { window.location.href = 'login.html'; }, 2000);
  });
</script>
</body>
</html>

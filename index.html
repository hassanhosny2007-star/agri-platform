<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="site-assets/logo.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المنصة الزراعية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=Poppins:wght@800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F6F1E4; --ink: #1E2A1B; --leaf: #3B5B37; --leaf-deep: #24391F;
    --rust: #A85D28; --line: #CDBF9C; --paper: #FCFAF3;
  }
[data-theme="dark"]{
    --bg: #12181B;
    --ink: #EDEFEC;
    --leaf: #6FA568;
    --leaf-deep: #8FC286;
    --rust: #D48A52;
    --line: #2B3438;
    --paper: #1B2327;
}

  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'IBM Plex Sans Arabic', sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .card{
    max-width:480px; width:100%; text-align:center;
    background:var(--paper); border:1px solid var(--line); border-radius:18px;
    padding:48px 32px;
  }
  h1{ font-family:'Tajawal', sans-serif; font-weight:900; font-size:28px; color:var(--leaf-deep); }
  .brand-word{ font-family:'Poppins', sans-serif; font-weight:800; letter-spacing:.3px; font-size:26px; }
  .brand-word .b-agro{ color:var(--leaf-deep); }
  .brand-word .b-nex{ color:var(--leaf); }
  p{ margin-top:14px; color:#5b543f; font-size:15.5px; line-height:1.8; }
  p.tagline{ margin-top:6px; color:var(--rust); font-family:'Tajawal'; font-weight:700; font-size:14.5px; }
  .btns{ margin-top:32px; display:flex; flex-direction:column; gap:12px; }
  a.btn{
    display:block; text-decoration:none; padding:14px 20px; border-radius:10px;
    font-family:'Tajawal', sans-serif; font-weight:700; font-size:15.5px;
  }
  a.primary{ background:var(--leaf); color:var(--paper); }
  a.secondary{ background:transparent; color:var(--leaf-deep); border:1px solid var(--line); }

  .weather-widget{
    position:fixed; top:20px; right:20px; z-index:10;
    background:var(--paper); border:1px solid var(--line); border-radius:12px;
    padding:12px 16px; font-size:13.5px; min-width:150px;
    box-shadow:0 2px 8px rgba(30,42,27,0.08);
  }
  .weather-loading, .weather-error{ color:#8a7f63; }
  .weather-error{ color:var(--rust); font-size:12.5px; cursor:pointer; }
  .weather-data{ display:flex; flex-direction:column; gap:2px; }
  .weather-data .city{ font-family:'Tajawal'; font-weight:700; color:var(--leaf-deep); font-size:13px; }
  .weather-data .temp{ font-family:'Tajawal'; font-weight:900; font-size:22px; color:var(--leaf-deep); }
  .weather-data .humidity{ color:#5b543f; font-size:12.5px; }
  @media (max-width:520px){ .weather-widget{ position:static; margin-bottom:18px; width:100%; } }

  #theme-toggle-fixed{
    position:fixed; top:20px; left:20px; z-index:20;
    width:42px; height:42px; border-radius:10px; border:1px solid var(--line);
    background:var(--paper); cursor:pointer; font-size:17px;
    display:flex; align-items:center; justify-content:center;
  }
</style>
</head>
<body>
<script>document.documentElement.setAttribute("data-theme", localStorage.getItem("agronex-theme") || "light");</script>

  <div class="weather-widget" id="weather">
    <div class="weather-loading">📍 جاري تحديد موقعك...</div>
  </div>
  <button id="theme-toggle-fixed" title="تبديل الوضع الليلي/النهاري">🌙</button>
  <div class="card">
    <img src="site-assets/logo.png" alt="AgroNex" style="width:120px; height:120px; object-fit:contain; margin:0 auto;" onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='block';">
    <div class="brand-word" id="logo-fallback" style="display:none;"><span class="b-agro">Agro</span><span class="b-nex">Nex</span></div>
    <p class="tagline">حينما تلتقي الزراعة بالتكنولوجيا</p>
    <p>تشخيص أمراض النبات، متابعة المحاصيل، وربط المزارعين بالخبراء — كل ده في مكان واحد.</p>
    <div class="btns">
      <a class="btn primary" href="login.html">تسجيل الدخول</a>
      <a class="btn secondary" href="login.html#signup">إنشاء حساب جديد</a>
    </div>
  </div>

<script>
  const themeBtn = document.getElementById('theme-toggle-fixed');
  themeBtn.textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';
  themeBtn.addEventListener('click', () => {
    const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('agronex-theme', next);
    themeBtn.textContent = next === 'dark' ? '☀️' : '🌙';
  });

  const weatherEl = document.getElementById('weather');

  function showWeatherError(msg){
    weatherEl.innerHTML = `<div class="weather-error" id="retry-weather">⚠️ ${msg}<br><span style="text-decoration:underline">إعادة المحاولة</span></div>`;
    document.getElementById('retry-weather').addEventListener('click', loadWeather);
  }

  async function loadWeather(){
    weatherEl.innerHTML = '<div class="weather-loading">📍 جاري تحديد موقعك...</div>';
    if(!navigator.geolocation){
      showWeatherError('المتصفح لا يدعم تحديد الموقع');
      return;
    }
    navigator.geolocation.getCurrentPosition(async (pos) => {
      const { latitude, longitude } = pos.coords;
      try{
        weatherEl.innerHTML = '<div class="weather-loading">☁️ جاري جلب بيانات الطقس...</div>';
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m`;
        const res = await fetch(url);
        const data = await res.json();
        const temp = Math.round(data.current.temperature_2m);
        const humidity = Math.round(data.current.relative_humidity_2m);

        let cityName = 'موقعك الحالي';
        try{
          const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/reverse?latitude=${latitude}&longitude=${longitude}&language=ar`);
          const geoData = await geoRes.json();
          if(geoData.results && geoData.results.length){
            cityName = geoData.results[0].name;
          }
        }catch(e){ /* الاسم اختياري، لو فشل نسيب القيمة الافتراضية */ }

        weatherEl.innerHTML = `
          <div class="weather-data">
            <div class="city">📍 ${cityName}</div>
            <div class="temp">${temp}°</div>
            <div class="humidity">الرطوبة: ${humidity}%</div>
          </div>`;
      }catch(err){
        showWeatherError('تعذر جلب بيانات الطقس');
      }
    }, (err) => {
      if(err.code === err.PERMISSION_DENIED){
        showWeatherError('يرجى السماح بالوصول للموقع لعرض الطقس');
      } else {
        showWeatherError('تعذر تحديد الموقع');
      }
    });
  }

  loadWeather();
</script>
</body>
</html>

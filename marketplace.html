<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="site-assets/logo.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>السوق الأونلاين — AgroNex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="site-assets/permissions.js"></script>
<style>
  :root{
    --bg:#F6F1E4; --ink:#1E2A1B; --leaf:#3B5B37; --leaf-deep:#24391F;
    --rust:#A85D28; --line:#CDBF9C; --paper:#FCFAF3; --gold:#C9A227;
  }
[data-theme="dark"]{
    --bg: #12181B; --ink: #EDEFEC; --leaf: #6FA568; --leaf-deep: #8FC286;
    --rust: #D48A52; --line: #2B3438; --paper: #1B2327; --gold:#E0B84D;
}
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--bg); color:var(--ink); font-family:'IBM Plex Sans Arabic', sans-serif; padding:24px; }
  .wrap{ max-width:900px; margin:0 auto; }
  header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:10px; }
  header h1{ font-family:'Tajawal'; font-weight:900; font-size:20px; color:var(--leaf-deep); }
  .header-btns{ display:flex; gap:8px; }
  .hbtn{ padding:9px 16px; border-radius:8px; border:1px solid var(--line); background:var(--paper); font-family:'Tajawal'; font-weight:700; font-size:13px; cursor:pointer; text-decoration:none; color:var(--ink); position:relative; }
  .cart-badge{ position:absolute; top:-6px; left:-6px; background:var(--rust); color:#fff; font-size:10px; font-weight:800; min-width:18px; height:18px; border-radius:9px; display:flex; align-items:center; justify-content:center; padding:0 4px; }

  .cat-tabs{ display:flex; gap:8px; margin-bottom:18px; overflow-x:auto; padding-bottom:4px; }
  .cat-tab{ flex-shrink:0; padding:10px 18px; border-radius:20px; border:1px solid var(--line); background:var(--paper); cursor:pointer; font-family:'Tajawal'; font-weight:700; font-size:13px; }
  .cat-tab.active{ background:var(--leaf); color:#fff; border-color:var(--leaf); }

  .search-box{ margin-bottom:18px; }
  .search-box input{ width:100%; padding:12px 16px; border-radius:10px; border:1px solid var(--line); background:var(--paper); font-family:inherit; font-size:14px; }

  .prod-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(200px,1fr)); gap:16px; }
  .prod-card{ background:var(--paper); border:1px solid var(--line); border-radius:16px; overflow:hidden; }
  .prod-card img{ width:100%; height:130px; object-fit:cover; background:#e7e0cb; }
  .prod-body{ padding:14px; }
  .prod-name{ font-family:'Tajawal'; font-weight:700; font-size:14px; }
  .prod-seller{ font-size:11px; color:#8a7f63; margin-top:2px; }
  .prod-price{ font-family:'Tajawal'; font-weight:900; font-size:17px; color:var(--leaf-deep); margin-top:8px; }
  .prod-unit{ font-size:11px; color:#8a7f63; }
  .payment-badge{ display:inline-block; font-size:10px; padding:2px 8px; border-radius:10px; margin-top:6px; }
  .payment-badge.full_online{ background:#E3F2FD; color:#1565C0; }
  .payment-badge.deposit_cod{ background:#FFF6E0; color:var(--gold); }
  .payment-badge.full_cod{ background:#E8F5E9; color:#2E7D32; }
  .add-cart-btn{ width:100%; margin-top:10px; padding:9px; border:none; border-radius:8px; background:var(--leaf); color:#fff; font-family:'Tajawal'; font-weight:700; font-size:12.5px; cursor:pointer; }
  .add-cart-btn:disabled{ opacity:.5; cursor:not-allowed; }
  .empty{ text-align:center; color:#5b543f; padding:50px 0; grid-column:1/-1; }

  /* نافذة تفاصيل المنتج */
  .modal-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; padding:16px; z-index:100; }
  .modal-overlay.open{ display:flex; }
  .modal-box{ background:var(--paper); border-radius:18px; max-width:480px; width:100%; max-height:92vh; overflow-y:auto; position:relative; padding:22px; }
  .modal-close{ position:absolute; top:14px; left:14px; width:32px; height:32px; border-radius:50%; border:none; background:var(--bg); cursor:pointer; font-size:15px; z-index:2; }
  .gallery-main{ width:100%; height:220px; border-radius:14px; overflow:hidden; background:#e7e0cb; cursor:zoom-in; }
  .gallery-main img{ width:100%; height:100%; object-fit:cover; }
  .gallery-thumbs{ display:flex; gap:8px; margin-top:8px; overflow-x:auto; }
  .gallery-thumbs img{ width:56px; height:56px; border-radius:8px; object-fit:cover; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
  .gallery-thumbs img.active{ border-color:var(--leaf); }
  .modal-name{ font-family:'Tajawal'; font-weight:800; font-size:18px; margin-top:16px; }
  .modal-seller{ font-size:12.5px; color:#8a7f63; margin-top:3px; }
  .modal-desc{ font-size:13.5px; color:#5b543f; margin-top:10px; line-height:1.7; }
  .modal-price{ font-family:'Tajawal'; font-weight:900; font-size:22px; color:var(--leaf-deep); margin-top:14px; }
  .modal-stock{ font-size:12px; color:#8a7f63; margin-top:2px; }
  .qty-row{ display:flex; align-items:center; gap:12px; margin-top:16px; }
  .qty-row .qbtn{ width:36px; height:36px; border-radius:9px; border:1px solid var(--line); background:var(--bg); cursor:pointer; font-size:17px; }
  .qty-row .qval{ font-family:'Tajawal'; font-weight:800; font-size:17px; min-width:32px; text-align:center; }
  .modal-add-btn{ width:100%; margin-top:18px; padding:13px; border:none; border-radius:10px; background:var(--leaf); color:#fff; font-family:'Tajawal'; font-weight:700; font-size:15px; cursor:pointer; }
  .modal-add-btn:disabled{ opacity:.5; cursor:not-allowed; }

  /* تكبير الصورة (Lightbox) */
  .lightbox{ position:fixed; inset:0; background:rgba(0,0,0,.9); display:none; align-items:center; justify-content:center; z-index:200; padding:20px; }
  .lightbox.open{ display:flex; }
  .lightbox img{ max-width:100%; max-height:100%; border-radius:8px; }
</style>
</head>
<body>
<script>document.documentElement.setAttribute("data-theme", localStorage.getItem("agronex-theme") || "light");</script>
<div class="wrap">
  <header>
    <h1>🛒 السوق الأونلاين</h1>
    <div class="header-btns">
      <a class="hbtn" href="cart.html">🛍️ العربة<span class="cart-badge" id="cart-badge" style="display:none;">0</span></a>
      <a class="hbtn" href="my-orders.html">📦 طلباتي</a>
      <a class="hbtn" href="dashboard.html">الرئيسية</a>
    </div>
  </header>

  <div class="search-box">
    <input type="text" id="search-input" placeholder="ابحث عن منتج...">
  </div>

  <div class="cat-tabs" id="cat-tabs">
    <div class="cat-tab active" data-cat="">الكل</div>
    <div class="cat-tab" data-cat="fertilizer" id="tab-fertilizer">🌾 أسمدة</div>
    <div class="cat-tab" data-cat="seeds" id="tab-seeds">🌱 بذور</div>
    <div class="cat-tab" data-cat="pesticides" id="tab-pesticides">🧪 مبيدات</div>
    <div class="cat-tab" data-cat="equipment" id="tab-equipment">🛠️ مستلزمات</div>
  </div>

  <div class="prod-grid" id="prod-grid"><div class="empty">جاري التحميل...</div></div>
</div>

<!-- نافذة تفاصيل المنتج -->
<div class="modal-overlay" id="detail-modal">
  <div class="modal-box">
    <button class="modal-close" id="modal-close-btn">✕</button>
    <div id="modal-body"></div>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <img id="lightbox-img" src="">
</div>

<script>
  const SUPABASE_URL = "https://tzpoytzacshvmpzfclfv.supabase.co";
  const SUPABASE_KEY = "sb_publishable_nRVb27QsyVgsiRB-vBFqgw_rNyhkDQs";
  const { createClient } = supabase;
  const customStorage = {
    getItem: (key) => {
      const remember = localStorage.getItem('agronex-remember') !== 'false';
      return remember ? localStorage.getItem(key) : sessionStorage.getItem(key);
    },
    setItem: (key, value) => {
      const remember = localStorage.getItem('agronex-remember') !== 'false';
      if(remember){ localStorage.setItem(key, value); sessionStorage.removeItem(key); }
      else { sessionStorage.setItem(key, value); localStorage.removeItem(key); }
    },
    removeItem: (key) => { localStorage.removeItem(key); sessionStorage.removeItem(key); }
  };
  const db = createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storage: customStorage } });

  const PAYMENT_LABELS = { full_online: '💳 دفع أونلاين كامل', deposit_cod: '💳 دفعة مقدمة + استلام', full_cod: '💵 دفع عند الاستلام' };
  const CAT_LABELS = { fertilizer:'أسمدة', seeds:'بذور', pesticides:'مبيدات', equipment:'مستلزمات زراعية' };

  let allProducts = [];
  let currentCat = '';
  let currentUserId = null;
  let buyPerms = {}; // { fertilizer: true/false, seeds: true/false, pesticides: true/false }

  function applyBuyPermissions(isAdmin){
    if(isAdmin) return; // الأدمن يشوف كل حاجة
    ['fertilizer', 'seeds', 'pesticides', 'equipment'].forEach(cat => {
      if(buyPerms['can_buy_' + cat] === false){
        const tab = document.getElementById('tab-' + cat);
        if(tab) tab.remove();
      }
    });
  }

  async function loadProducts(){
    const { data, error } = await db.from('products')
      .select('id, seller_id, category, name, description, price, unit, stock_quantity, image_url, image_urls, payment_type, deposit_percent, is_active, created_at, seller:seller_id(full_name)')
      .eq('is_active', true).order('created_at', { ascending: false });
    if(error){ document.getElementById('prod-grid').innerHTML = '<div class="empty">تعذر تحميل المنتجات</div>'; return; }
    // استبعاد المنتجات في الفئات اللي المستخدم مالوش صلاحية شراء فيها
    allProducts = (data || []).filter(p => buyPerms['can_buy_' + p.category] !== false);
    renderProducts();
  }

  async function updateCartBadge(){
    const { data } = await db.from('cart_items').select('quantity').eq('user_id', currentUserId);
    const total = (data || []).reduce((sum, i) => sum + Number(i.quantity), 0);
    const badge = document.getElementById('cart-badge');
    if(total > 0){ badge.textContent = total; badge.style.display = 'flex'; }
    else badge.style.display = 'none';
  }

  function renderProducts(){
    const search = document.getElementById('search-input').value.trim().toLowerCase();
    let list = allProducts;
    if(currentCat) list = list.filter(p => p.category === currentCat);
    if(search) list = list.filter(p => p.name.toLowerCase().includes(search));

    const grid = document.getElementById('prod-grid');
    if(!list.length){ grid.innerHTML = '<div class="empty">مفيش منتجات مطابقة</div>'; return; }

    grid.innerHTML = list.map(p => `
      <div class="prod-card" data-open-id="${p.id}">
        <img src="${(p.image_urls && p.image_urls[0]) || p.image_url || ''}" onerror="this.style.display='none'">
        <div class="prod-body">
          <div class="prod-name">${p.name}</div>
          <div class="prod-seller">البائع: ${p.seller?.full_name || '—'} · ${CAT_LABELS[p.category]}</div>
          <div class="prod-price">${p.price} ج.م <span class="prod-unit">/ ${p.unit}</span></div>
          <span class="payment-badge ${p.payment_type}">${PAYMENT_LABELS[p.payment_type]}</span>
          <button class="add-cart-btn" data-open-id="${p.id}" ${p.stock_quantity <= 0 ? 'disabled' : ''}>
            ${p.stock_quantity <= 0 ? 'نفذت الكمية' : '👁️ عرض التفاصيل والشراء'}
          </button>
        </div>
      </div>
    `).join('');

    grid.querySelectorAll('[data-open-id]').forEach(el => {
      el.addEventListener('click', () => openProductDetail(el.getAttribute('data-open-id')));
    });
  }

  function openProductDetail(productId){
    const p = allProducts.find(x => x.id === productId);
    if(!p) return;

    const images = (p.image_urls && p.image_urls.length) ? p.image_urls : (p.image_url ? [p.image_url] : []);
    let currentImgIdx = 0;
    let qty = 1;

    function renderModal(){
      document.getElementById('modal-body').innerHTML = `
        <div class="gallery-main" id="gallery-main">
          ${images[currentImgIdx] ? `<img src="${images[currentImgIdx]}">` : ''}
        </div>
        ${images.length > 1 ? `
          <div class="gallery-thumbs">
            ${images.map((img, i) => `<img src="${img}" class="${i === currentImgIdx ? 'active' : ''}" data-idx="${i}">`).join('')}
          </div>` : ''}
        <div class="modal-name">${p.name}</div>
        <div class="modal-seller">البائع: ${p.seller?.full_name || '—'} · ${CAT_LABELS[p.category]}</div>
        ${p.description ? `<div class="modal-desc">${p.description}</div>` : ''}
        <div class="modal-price">${p.price} ج.م / ${p.unit}</div>
        <div class="modal-stock">الكمية المتاحة: ${p.stock_quantity}</div>
        <span class="payment-badge ${p.payment_type}" style="margin-top:8px;">${PAYMENT_LABELS[p.payment_type]}</span>

        <div class="qty-row">
          <button class="qbtn" id="qty-minus">−</button>
          <span class="qval" id="qty-val">${qty}</span>
          <button class="qbtn" id="qty-plus">+</button>
          <span style="font-size:12.5px; color:#8a7f63;">${p.unit}</span>
        </div>

        <button class="modal-add-btn" id="modal-add-btn" ${p.stock_quantity <= 0 ? 'disabled' : ''}>
          + أضف ${qty} ${p.unit} للعربة
        </button>
      `;

      document.getElementById('gallery-main').addEventListener('click', () => {
        if(images[currentImgIdx]) openLightbox(images[currentImgIdx]);
      });
      document.querySelectorAll('.gallery-thumbs img').forEach(thumb => {
        thumb.addEventListener('click', () => {
          currentImgIdx = parseInt(thumb.getAttribute('data-idx'));
          renderModal();
        });
      });
      document.getElementById('qty-minus').addEventListener('click', () => {
        if(qty > 1){ qty--; renderModal(); }
      });
      document.getElementById('qty-plus').addEventListener('click', () => {
        if(qty < p.stock_quantity){ qty++; renderModal(); }
      });
      document.getElementById('modal-add-btn').addEventListener('click', async () => {
        const btn = document.getElementById('modal-add-btn');
        btn.disabled = true;
        btn.textContent = 'جاري الإضافة...';

        const { data: existing } = await db.from('cart_items').select('*').eq('user_id', currentUserId).eq('product_id', p.id).maybeSingle();
        if(existing){
          await db.from('cart_items').update({ quantity: existing.quantity + qty }).eq('id', existing.id);
        } else {
          await db.from('cart_items').insert({ user_id: currentUserId, product_id: p.id, quantity: qty });
        }

        btn.textContent = '✅ اتضافت للعربة';
        updateCartBadge();
        setTimeout(() => { closeModal(); }, 900);
      });
    }

    renderModal();
    document.getElementById('detail-modal').classList.add('open');
  }

  function closeModal(){ document.getElementById('detail-modal').classList.remove('open'); }
  document.getElementById('modal-close-btn').addEventListener('click', closeModal);
  document.getElementById('detail-modal').addEventListener('click', (e) => {
    if(e.target.id === 'detail-modal') closeModal();
  });

  function openLightbox(src){
    document.getElementById('lightbox-img').src = src;
    document.getElementById('lightbox').classList.add('open');
  }
  document.getElementById('lightbox').addEventListener('click', () => {
    document.getElementById('lightbox').classList.remove('open');
  });

  document.querySelectorAll('.cat-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentCat = tab.getAttribute('data-cat');
      renderProducts();
    });
  });
  document.getElementById('search-input').addEventListener('input', renderProducts);

  (async () => {
    const { data: { session } } = await db.auth.getSession();
    if(!session){ window.location.href = 'login.html'; return; }
    currentUserId = session.user.id;

    const { data: profile } = await db.from('profiles').select('role, permissions').eq('id', currentUserId).single();
    const isAdmin = profile && profile.role === 'admin';
    buyPerms = (profile && profile.permissions) || {};
    applyBuyPermissions(isAdmin);

    loadProducts();
    updateCartBadge();
  })();
</script>
</body>
</html>

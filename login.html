<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول — المنصة الزراعية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="site-assets/egypt-locations.js"></script>
<style>
  :root{
    --bg: #F6F1E4; --ink: #1E2A1B; --leaf: #3B5B37; --leaf-deep: #24391F;
    --rust: #A85D28; --line: #CDBF9C; --paper: #FCFAF3; --error:#B23A2E;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'IBM Plex Sans Arabic', sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .card{
    max-width:420px; width:100%;
    background:var(--paper); border:1px solid var(--line); border-radius:18px;
    padding:36px 32px;
  }
  h1{ font-family:'Tajawal', sans-serif; font-weight:900; font-size:22px; color:var(--leaf-deep); text-align:center; }
  p.tagline{ margin-top:6px; text-align:center; color:var(--rust); font-family:'Tajawal'; font-weight:700; font-size:13px; }
  .tabs{ display:flex; margin-top:24px; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .tab{
    flex:1; text-align:center; padding:11px; cursor:pointer;
    font-family:'Tajawal'; font-weight:700; font-size:14.5px; color:#7a7259;
    background:var(--bg);
  }
  .tab.active{ background:var(--leaf); color:var(--paper); }
  form{ margin-top:22px; display:none; flex-direction:column; gap:14px; }
  form.active{ display:flex; }
  label{ font-size:13.5px; font-weight:600; color:var(--leaf-deep); }
  input{
    margin-top:6px; width:100%; padding:12px 14px; border-radius:9px;
    border:1px solid var(--line); background:#fff; font-size:15px; font-family:inherit;
  }
  input:focus{ outline:2px solid var(--leaf); }
  select{
    margin-top:6px; width:100%; padding:12px 14px; border-radius:9px;
    border:1px solid var(--line); background:#fff; font-size:15px; font-family:inherit;
  }
  select:focus{ outline:2px solid var(--leaf); }
  .remember-row{ display:flex; align-items:center; gap:8px; margin-top:2px; }
  .remember-row input{ width:auto; margin:0; }
  .remember-row label{ margin:0; font-weight:400; color:#5b543f; }
  .pw-wrap{ position:relative; }
  .pw-wrap input{ padding-left:42px; }
  .pw-toggle{
    position:absolute; left:12px; top:50%; transform:translateY(-50%);
    cursor:pointer; font-size:15px; user-select:none; margin-top:3px;
  }
  .forgot-row{ text-align:left; margin-top:-6px; }
  .forgot-row span{ font-size:12.5px; color:var(--rust); cursor:pointer; text-decoration:underline; }
  .forgot-hint{ font-size:13px; color:#5b543f; }
  .back-link{ text-align:center; font-size:12.5px; color:var(--leaf-deep); cursor:pointer; text-decoration:underline; margin-top:2px; }
  .consent-row{ display:flex; align-items:flex-start; gap:8px; margin-top:2px; }
  .consent-row input{ width:auto; margin:3px 0 0 0; }
  .consent-row label{ margin:0; font-weight:400; color:#5b543f; font-size:12.5px; line-height:1.6; }
  button.submit{
    margin-top:6px; padding:13px; border:none; border-radius:9px;
    background:var(--leaf); color:var(--paper); font-family:'Tajawal'; font-weight:700;
    font-size:15.5px; cursor:pointer;
  }
  button.submit:disabled{ opacity:.6; cursor:not-allowed; }
  .msg{ margin-top:16px; font-size:14px; text-align:center; display:none; padding:10px; border-radius:8px; }
  .msg.error{ display:block; background:rgba(178,58,46,0.1); color:var(--error); }
  .msg.success{ display:block; background:rgba(59,91,55,0.1); color:var(--leaf-deep); }

  /* اختيار العنوان */
  .address-group{ border:1px solid var(--line); border-radius:10px; padding:12px; background:var(--bg); }
  .address-group label{ display:block; margin-bottom:4px; }
</style>
</head>
<body>
  <div class="card">
    <h1>🌱 AgroNex</h1>
    <p class="tagline">حينما تلتقي الزراعة بالتكنولوجيا</p>
    <div class="tabs">
      <div class="tab active" id="tab-login">تسجيل الدخول</div>
      <div class="tab" id="tab-signup">حساب جديد</div>
    </div>

    <form id="form-login" class="active">
      <div>
        <label>البريد الإلكتروني</label>
        <input type="email" id="login-email" required>
      </div>
      <div>
        <label>كلمة المرور</label>
        <div class="pw-wrap">
          <input type="password" id="login-password" required>
          <span class="pw-toggle" data-target="login-password">👁️</span>
        </div>
      </div>
      <div class="forgot-row"><span id="forgot-link">نسيت كلمة المرور؟</span></div>
      <div class="remember-row">
        <input type="checkbox" id="login-remember" checked>
        <label for="login-remember">تذكرني</label>
      </div>
      <button class="submit" type="submit">دخول</button>
    </form>

    <form id="form-forgot">
      <p class="forgot-hint">هنبعتلك رابط لإعادة تعيين كلمة المرور على بريدك الإلكتروني.</p>
      <div>
        <label>البريد الإلكتروني</label>
        <input type="email" id="forgot-email" required>
      </div>
      <button class="submit" type="submit">إرسال رابط إعادة التعيين</button>
      <p class="back-link" id="back-to-login">العودة لتسجيل الدخول</p>
    </form>

    <form id="form-signup">
      <div>
        <label>الاسم الثلاثي</label>
        <input type="text" id="signup-fullname" required placeholder="مثال: محمد أحمد علي">
      </div>
      <div>
        <label>البريد الإلكتروني</label>
        <input type="email" id="signup-email" required>
      </div>
      <div>
        <label>كلمة المرور (٦ حروف على الأقل)</label>
        <div class="pw-wrap">
          <input type="password" id="signup-password" required minlength="6">
          <span class="pw-toggle" data-target="signup-password">👁️</span>
        </div>
      </div>
      <div>
        <label>رقم الموبايل</label>
        <input type="tel" id="signup-phone" required pattern="[0-9]{10,15}" placeholder="01xxxxxxxxx">
      </div>
      <div>
        <label>الرقم القومي</label>
        <input type="text" id="signup-national-id" required pattern="[0-9]{14}" maxlength="14" placeholder="١٤ رقم">
      </div>

      <div class="address-group">
        <div>
          <label>المحافظة</label>
          <select id="signup-governorate" required></select>
          <input type="text" id="signup-governorate-other" placeholder="اكتب اسم المحافظة" style="display:none; margin-top:8px;">
        </div>
        <div style="margin-top:10px;">
          <label>المركز / الحي</label>
          <select id="signup-center" required></select>
          <input type="text" id="signup-center-other" placeholder="اكتب اسم المركز" style="display:none; margin-top:8px;">
        </div>
        <div style="margin-top:10px;">
          <label>العزبة / القرية / الشارع</label>
          <input type="text" id="signup-village" required placeholder="اكتب اسم العزبة أو القرية أو الشارع">
        </div>
      </div>

      <div>
        <label>أنا بصفتي</label>
        <select id="signup-role" required>
          <option value="farmer">مزارع</option>
          <option value="engineer">مهندس زراعي</option>
          <option value="trader">تاجر</option>
          <option value="company">شركة</option>
        </select>
      </div>
      <div class="consent-row">
        <input type="checkbox" id="signup-consent" required>
        <label for="signup-consent">أوافق على شروط الاستخدام وسياسة الخصوصية الخاصة بـ AgroNex</label>
      </div>
      <button class="submit" type="submit">إنشاء حساب</button>
    </form>

    <div class="msg" id="msg"></div>
  </div>

<script>
  // إعدادات الاتصال بـ Supabase
  const SUPABASE_URL = "https://tzpoytzacshvmpzfclfv.supabase.co";
  const SUPABASE_KEY = "sb_publishable_nRVb27QsyVgsiRB-vBFqgw_rNyhkDQs";
  const { createClient } = supabase;
  const customStorage = {
    getItem: (key) => {
      const remember = localStorage.getItem('agronex-remember') !== 'false';
      return remember ? localStorage.getItem(key) : sessionStorage.getItem(key);
    },
    setItem: (key, value) => {
      const remember = localStorage.getItem('agronex-remember') !== 'false';
      if(remember){ localStorage.setItem(key, value); sessionStorage.removeItem(key); }
      else { sessionStorage.setItem(key, value); localStorage.removeItem(key); }
    },
    removeItem: (key) => { localStorage.removeItem(key); sessionStorage.removeItem(key); }
  };
  const db = createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storage: customStorage } });

  // بناء قائمة المحافظات والمراكز
  AgroNexLocations.buildPicker({
    govSelectId: 'signup-governorate',
    centerSelectId: 'signup-center',
    otherGovInputId: 'signup-governorate-other',
    otherCenterInputId: 'signup-center-other',
  });

  const tabLogin = document.getElementById('tab-login');
  const tabSignup = document.getElementById('tab-signup');
  const formLogin = document.getElementById('form-login');
  const formSignup = document.getElementById('form-signup');
  const formForgot = document.getElementById('form-forgot');
  const msg = document.getElementById('msg');

  function hideAllForms(){
    [formLogin, formSignup, formForgot].forEach(f => f.classList.remove('active'));
    [tabLogin, tabSignup].forEach(t => t.classList.remove('active'));
  }
  function showLogin(){
    hideAllForms();
    tabLogin.classList.add('active'); formLogin.classList.add('active');
    hideMsg();
  }
  function showSignup(){
    hideAllForms();
    tabSignup.classList.add('active'); formSignup.classList.add('active');
    hideMsg();
  }
  function showForgot(){
    hideAllForms();
    formForgot.classList.add('active');
    hideMsg();
  }
  function hideMsg(){ msg.className = 'msg'; msg.textContent=''; }
  function showMsg(text, type){ msg.textContent = text; msg.className = 'msg ' + type; }

  tabLogin.addEventListener('click', showLogin);
  tabSignup.addEventListener('click', showSignup);
  document.getElementById('forgot-link').addEventListener('click', showForgot);
  document.getElementById('back-to-login').addEventListener('click', showLogin);
  if(window.location.hash === '#signup'){ showSignup(); }

  document.querySelectorAll('.pw-toggle').forEach(toggle => {
    toggle.addEventListener('click', () => {
      const input = document.getElementById(toggle.dataset.target);
      const isHidden = input.type === 'password';
      input.type = isHidden ? 'text' : 'password';
      toggle.textContent = isHidden ? '🙈' : '👁️';
    });
  });

  formForgot.addEventListener('submit', async (e)=>{
    e.preventDefault();
    hideMsg();
    const email = document.getElementById('forgot-email').value;
    const { error } = await db.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + '/reset-password.html'
    });
    if(error){ showMsg('خطأ: ' + error.message, 'error'); return; }
    showMsg('تم إرسال رابط إعادة التعيين، تفقّد بريدك الإلكتروني.', 'success');
  });

  formLogin.addEventListener('submit', async (e)=>{
    e.preventDefault();
    hideMsg();
    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;
    const remember = document.getElementById('login-remember').checked;
    localStorage.setItem('agronex-remember', remember ? 'true' : 'false');
    const { data, error } = await db.auth.signInWithPassword({ email, password });
    if(error){ showMsg('خطأ: ' + error.message, 'error'); return; }
    window.location.href = 'dashboard.html';
  });

  formSignup.addEventListener('submit', async (e)=>{
    e.preventDefault();
    hideMsg();
    const fullName = document.getElementById('signup-fullname').value.trim();
    if(fullName.split(/\s+/).filter(Boolean).length < 3){
      showMsg('من فضلك اكتب الاسم الثلاثي كاملًا.', 'error');
      return;
    }
    const email = document.getElementById('signup-email').value;
    const password = document.getElementById('signup-password').value;
    const role = document.getElementById('signup-role').value;
    const phone = document.getElementById('signup-phone').value;
    const nationalId = document.getElementById('signup-national-id').value;

    // تجميع العنوان من المحافظة + المركز + العزبة/القرية
    const { governorate, center } = AgroNexLocations.getPickerValues({
      govSelectId: 'signup-governorate',
      centerSelectId: 'signup-center',
      otherGovInputId: 'signup-governorate-other',
      otherCenterInputId: 'signup-center-other',
    });
    const village = document.getElementById('signup-village').value.trim();

    if(!governorate || !center || !village){
      showMsg('من فضلك أكمل بيانات العنوان بالكامل (المحافظة، المركز، العزبة/القرية).', 'error');
      return;
    }
    const address = `${governorate} - ${center} - ${village}`;

    const { data, error } = await db.auth.signUp({
      email, password,
      options: { data: { role: role, phone: phone, national_id: nationalId, address: address, full_name: fullName } }
    });
    if(error){
      if(error.message.includes('duplicate') || error.message.includes('unique')){
        showMsg('رقم الموبايل أو الرقم القومي مسجل بحساب آخر بالفعل.', 'error');
      } else {
        showMsg('خطأ: ' + error.message, 'error');
      }
      return;
    }
    showMsg('تم إنشاء الحساب بنجاح! يمكنك الآن تسجيل الدخول.', 'success');
    showLogin();
  });
</script>
</body>
</html>

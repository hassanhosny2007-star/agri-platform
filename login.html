<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول — المنصة الزراعية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg: #F6F1E4; --ink: #1E2A1B; --leaf: #3B5B37; --leaf-deep: #24391F;
    --rust: #A85D28; --line: #CDBF9C; --paper: #FCFAF3; --error:#B23A2E;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'IBM Plex Sans Arabic', sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .card{
    max-width:420px; width:100%;
    background:var(--paper); border:1px solid var(--line); border-radius:18px;
    padding:36px 32px;
  }
  h1{ font-family:'Tajawal', sans-serif; font-weight:900; font-size:22px; color:var(--leaf-deep); text-align:center; }
  p.tagline{ margin-top:6px; text-align:center; color:var(--rust); font-family:'Tajawal'; font-weight:700; font-size:13px; }
  .tabs{ display:flex; margin-top:24px; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .tab{
    flex:1; text-align:center; padding:11px; cursor:pointer;
    font-family:'Tajawal'; font-weight:700; font-size:14.5px; color:#7a7259;
    background:var(--bg);
  }
  .tab.active{ background:var(--leaf); color:var(--paper); }
  form{ margin-top:22px; display:none; flex-direction:column; gap:14px; }
  form.active{ display:flex; }
  label{ font-size:13.5px; font-weight:600; color:var(--leaf-deep); }
  input{
    margin-top:6px; width:100%; padding:12px 14px; border-radius:9px;
    border:1px solid var(--line); background:#fff; font-size:15px; font-family:inherit;
  }
  input:focus{ outline:2px solid var(--leaf); }
  select{
    margin-top:6px; width:100%; padding:12px 14px; border-radius:9px;
    border:1px solid var(--line); background:#fff; font-size:15px; font-family:inherit;
  }
  select:focus{ outline:2px solid var(--leaf); }
  .remember-row{ display:flex; align-items:center; gap:8px; margin-top:2px; }
  .remember-row input{ width:auto; margin:0; }
  .remember-row label{ margin:0; font-weight:400; color:#5b543f; }
  button.submit{
    margin-top:6px; padding:13px; border:none; border-radius:9px;
    background:var(--leaf); color:var(--paper); font-family:'Tajawal'; font-weight:700;
    font-size:15.5px; cursor:pointer;
  }
  button.submit:disabled{ opacity:.6; cursor:not-allowed; }
  .msg{ margin-top:16px; font-size:14px; text-align:center; display:none; padding:10px; border-radius:8px; }
  .msg.error{ display:block; background:rgba(178,58,46,0.1); color:var(--error); }
  .msg.success{ display:block; background:rgba(59,91,55,0.1); color:var(--leaf-deep); }
</style>
</head>
<body>
  <div class="card">
    <h1>🌱 AgroNex</h1>
    <p class="tagline">حينما تلتقي الزراعة بالتكنولوجيا</p>
    <div class="tabs">
      <div class="tab active" id="tab-login">تسجيل الدخول</div>
      <div class="tab" id="tab-signup">حساب جديد</div>
    </div>

    <form id="form-login" class="active">
      <div>
        <label>البريد الإلكتروني</label>
        <input type="email" id="login-email" required>
      </div>
      <div>
        <label>كلمة المرور</label>
        <input type="password" id="login-password" required>
      </div>
      <div class="remember-row">
        <input type="checkbox" id="login-remember" checked>
        <label for="login-remember">تذكرني</label>
      </div>
      <button class="submit" type="submit">دخول</button>
    </form>

    <form id="form-signup">
      <div>
        <label>الاسم الثلاثي</label>
        <input type="text" id="signup-fullname" required placeholder="مثال: محمد أحمد علي">
      </div>
      <div>
        <label>البريد الإلكتروني</label>
        <input type="email" id="signup-email" required>
      </div>
      <div>
        <label>كلمة المرور (٦ حروف على الأقل)</label>
        <input type="password" id="signup-password" required minlength="6">
      </div>
      <div>
        <label>رقم الموبايل</label>
        <input type="tel" id="signup-phone" required pattern="[0-9]{10,15}" placeholder="01xxxxxxxxx">
      </div>
      <div>
        <label>الرقم القومي</label>
        <input type="text" id="signup-national-id" required pattern="[0-9]{14}" maxlength="14" placeholder="١٤ رقم">
      </div>
      <div>
        <label>العنوان</label>
        <input type="text" id="signup-address" required placeholder="المحافظة، المركز، القرية/الحي">
      </div>
      <div>
        <label>أنا بصفتي</label>
        <select id="signup-role" required>
          <option value="farmer">مزارع</option>
          <option value="engineer">مهندس زراعي</option>
          <option value="trader">تاجر</option>
          <option value="company">شركة</option>
        </select>
      </div>
      <button class="submit" type="submit">إنشاء حساب</button>
    </form>

    <div class="msg" id="msg"></div>
  </div>

<script>
  // إعدادات الاتصال بـ Supabase
  const SUPABASE_URL = "https://tzpoytzacshvmpzfclfv.supabase.co";
  const SUPABASE_KEY = "sb_publishable_nRVb27QsyVgsiRB-vBFqgw_rNyhkDQs";
  const { createClient } = supabase;
  const customStorage = {
    getItem: (key) => {
      const remember = localStorage.getItem('agronex-remember') !== 'false';
      return remember ? localStorage.getItem(key) : sessionStorage.getItem(key);
    },
    setItem: (key, value) => {
      const remember = localStorage.getItem('agronex-remember') !== 'false';
      if(remember){ localStorage.setItem(key, value); sessionStorage.removeItem(key); }
      else { sessionStorage.setItem(key, value); localStorage.removeItem(key); }
    },
    removeItem: (key) => { localStorage.removeItem(key); sessionStorage.removeItem(key); }
  };
  const db = createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storage: customStorage } });

  const tabLogin = document.getElementById('tab-login');
  const tabSignup = document.getElementById('tab-signup');
  const formLogin = document.getElementById('form-login');
  const formSignup = document.getElementById('form-signup');
  const msg = document.getElementById('msg');

  function showLogin(){
    tabLogin.classList.add('active'); tabSignup.classList.remove('active');
    formLogin.classList.add('active'); formSignup.classList.remove('active');
    hideMsg();
  }
  function showSignup(){
    tabSignup.classList.add('active'); tabLogin.classList.remove('active');
    formSignup.classList.add('active'); formLogin.classList.remove('active');
    hideMsg();
  }
  function hideMsg(){ msg.className = 'msg'; msg.textContent=''; }
  function showMsg(text, type){ msg.textContent = text; msg.className = 'msg ' + type; }

  tabLogin.addEventListener('click', showLogin);
  tabSignup.addEventListener('click', showSignup);
  if(window.location.hash === '#signup'){ showSignup(); }

  formLogin.addEventListener('submit', async (e)=>{
    e.preventDefault();
    hideMsg();
    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;
    const remember = document.getElementById('login-remember').checked;
    localStorage.setItem('agronex-remember', remember ? 'true' : 'false');
    const { data, error } = await db.auth.signInWithPassword({ email, password });
    if(error){ showMsg('خطأ: ' + error.message, 'error'); return; }
    window.location.href = 'dashboard.html';
  });

  formSignup.addEventListener('submit', async (e)=>{
    e.preventDefault();
    hideMsg();
    const fullName = document.getElementById('signup-fullname').value.trim();
    if(fullName.split(/\s+/).filter(Boolean).length < 3){
      showMsg('من فضلك اكتب الاسم الثلاثي كاملًا.', 'error');
      return;
    }
    const email = document.getElementById('signup-email').value;
    const password = document.getElementById('signup-password').value;
    const role = document.getElementById('signup-role').value;
    const phone = document.getElementById('signup-phone').value;
    const nationalId = document.getElementById('signup-national-id').value;
    const address = document.getElementById('signup-address').value;
    const { data, error } = await db.auth.signUp({
      email, password,
      options: { data: { role: role, phone: phone, national_id: nationalId, address: address, full_name: fullName } }
    });
    if(error){
      if(error.message.includes('duplicate') || error.message.includes('unique')){
        showMsg('رقم الموبايل أو الرقم القومي مسجل بحساب آخر بالفعل.', 'error');
      } else {
        showMsg('خطأ: ' + error.message, 'error');
      }
      return;
    }
    showMsg('تم إنشاء الحساب بنجاح! يمكنك الآن تسجيل الدخول.', 'success');
    showLogin();
  });
</script>
</body>
</html>

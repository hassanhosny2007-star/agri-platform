<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سجل التشخيصات — AgroNex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg:#F6F1E4; --ink:#1E2A1B; --leaf:#3B5B37; --leaf-deep:#24391F;
    --rust:#A85D28; --line:#CDBF9C; --paper:#FCFAF3;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--bg); color:var(--ink); font-family:'IBM Plex Sans Arabic', sans-serif; padding:24px; }
  .wrap{ max-width:720px; margin:0 auto; }
  header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
  header h1{ font-family:'Tajawal'; font-weight:900; font-size:20px; color:var(--leaf-deep); }
  a.back{ font-size:13.5px; color:var(--leaf-deep); text-decoration:none; border:1px solid var(--line); padding:8px 14px; border-radius:8px; background:var(--paper); }

  .item{ background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:12px; cursor:pointer; }
  .item .row{ display:flex; gap:14px; align-items:center; }
  .item img{ width:60px; height:60px; border-radius:10px; object-fit:cover; background:#e7e0cb; flex-shrink:0; }
  .item .info{ flex:1; min-width:0; }
  .item .title{ font-family:'Tajawal'; font-weight:700; font-size:15px; color:var(--leaf-deep); }
  .item .sub{ font-size:12.5px; color:#5b543f; margin-top:2px; }
  .item .date{ font-size:11.5px; color:#8a7f63; margin-top:2px; }
  .details{ display:none; margin-top:14px; padding-top:14px; border-top:1px dashed var(--line); }
  .details.active{ display:block; }
  .details .row2{ margin-bottom:10px; }
  .details .k{ font-family:'Tajawal'; font-weight:700; color:var(--rust); font-size:12.5px; }
  .details .v{ margin-top:3px; font-size:14px; line-height:1.8; }
  .empty{ text-align:center; color:#5b543f; padding:60px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📋 سجل التشخيصات</h1>
    <a class="back" href="diagnose.html">رجوع للتشخيص</a>
  </header>
  <div id="list"><div class="empty">جاري التحميل...</div></div>
</div>

<script>
  const SUPABASE_URL = "https://tzpoytzacshvmpzfclfv.supabase.co";
  const SUPABASE_KEY = "sb_publishable_nRVb27QsyVgsiRB-vBFqgw_rNyhkDQs";
  const { createClient } = supabase;
  const customStorage = {
    getItem: (key) => {
      const remember = localStorage.getItem('agronex-remember') !== 'false';
      return remember ? localStorage.getItem(key) : sessionStorage.getItem(key);
    },
    setItem: (key, value) => {
      const remember = localStorage.getItem('agronex-remember') !== 'false';
      if(remember){ localStorage.setItem(key, value); sessionStorage.removeItem(key); }
      else { sessionStorage.setItem(key, value); localStorage.removeItem(key); }
    },
    removeItem: (key) => { localStorage.removeItem(key); sessionStorage.removeItem(key); }
  };
  const db = createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storage: customStorage } });

  (async () => {
    const { data: { session } } = await db.auth.getSession();
    if(!session){ window.location.href = 'login.html'; return; }

    const { data: rows, error } = await db
      .from('diagnoses')
      .select('*')
      .eq('user_id', session.user.id)
      .order('created_at', { ascending: false });

    const list = document.getElementById('list');
    if(error){
      list.innerHTML = '<div class="empty">حدث خطأ: ' + error.message + '</div>';
      return;
    }
    if(!rows || rows.length === 0){
      list.innerHTML = '<div class="empty">لسه معملتش أي تشخيص. جرب من صفحة "تشخيص أمراض النبات"</div>';
      return;
    }

    list.innerHTML = rows.map((r, i) => `
      <div class="item" data-idx="${i}">
        <div class="row">
          <img src="${r.image_url || ''}" onerror="this.style.visibility='hidden'">
          <div class="info">
            <div class="title">${r.plant_name || 'نبات غير محدد'} — ${r.disease_name || '-'}</div>
            <div class="sub">نوع الأرض: ${r.soil_type || '-'}</div>
            <div class="date">${new Date(r.created_at).toLocaleString('ar-EG')}</div>
          </div>
        </div>
        <div class="details" id="details-${i}">
          <div class="row2"><div class="k">الأعراض</div><div class="v">${r.symptoms || '-'}</div></div>
          <div class="row2"><div class="k">الحلول المقترحة</div><div class="v">${r.treatment || '-'}</div></div>
        </div>
      </div>
    `).join('');

    document.querySelectorAll('.item').forEach(el => {
      el.addEventListener('click', () => {
        document.getElementById('details-' + el.dataset.idx).classList.toggle('active');
      });
    });
  })();
</script>
</body>
</html>
